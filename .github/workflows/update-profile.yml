name: Update profile assets

on:
  schedule:
    # UTC 03:17 / 15:17 = Asia/Seoul 12:17 / 00:17
    - cron: '17 3,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'profile.config.json'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/update-profile.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm test
      # Allows bootstrapping the asset branch before publishing the root README.
      - run: if [ -f README.md ]; then npm run check:readme; fi

  generate:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Read profile settings
        id: profile
        run: node scripts/workflow-config.mjs
      - name: Generate activity summaries
        run: node scripts/generate-activity.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ steps.profile.outputs.username }}
          github_token: ${{ github.token }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%23${{ steps.profile.outputs.snake_color }}
            dist/snake-dark.svg?palette=github-dark&color_snake=%23${{ steps.profile.outputs.snake_color }}
      - name: Validate the complete asset set
        run: node scripts/validate-assets.mjs
      - name: Publish generated assets
        run: node scripts/publish-assets.mjs
